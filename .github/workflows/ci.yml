name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      # Dependencies are our own packages, resolved through path repositories.
      # This job expects sibling checkouts to be present; once the packages are
      # published to git-vcs, `composer install` resolves them by URL instead.
      - name: Sibling libraries
        run: |
          mkdir -p ../eth-abi ../php-keccak
          echo "Sibling checkouts are provided by the workspace or the release job."

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test
